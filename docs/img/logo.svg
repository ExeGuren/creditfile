<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 520">
  <!-- Hexagon cube — navy top, left, right faces with yellow ZF letters -->

  <!-- Top face (lightest navy) -->
  <polygon points="260,30 470,150 260,270 50,150" fill="#2a3a6e"/>

  <!-- Left face (darkest navy) -->
  <polygon points="50,150 260,270 260,490 50,370" fill="#1b2a56"/>

  <!-- Right face (mid navy) -->
  <polygon points="470,150 260,270 260,490 470,370" fill="#253070"/>

  <!-- Yellow divider lines between faces -->
  <line x1="260" y1="270" x2="260" y2="490" stroke="#f5c518" stroke-width="4"/>
  <line x1="50"  y1="150" x2="470" y2="150" stroke="#f5c518" stroke-width="3" opacity=".4"/>
  <line x1="260" y1="30"  x2="50"  y2="150" stroke="#f5c518" stroke-width="3" opacity=".3"/>
  <line x1="260" y1="30"  x2="470" y2="150" stroke="#f5c518" stroke-width="3" opacity=".3"/>

  <!-- Z on left face -->
  <!-- Z: top-left to top-right, diagonal, bottom-left to bottom-right -->
  <polyline points="80,210 190,210 100,340 210,340"
    fill="none" stroke="#f5c518" stroke-width="28"
    stroke-linecap="round" stroke-linejoin="round"/>

  <!-- F on right face -->
  <!-- F: vertical bar + two horizontal bars -->
  <line x1="295" y1="210" x2="295" y2="360" stroke="#f5c518" stroke-width="28" stroke-linecap="round"/>
  <line x1="295" y1="210" x2="420" y2="210" stroke="#f5c518" stroke-width="28" stroke-linecap="round"/>
  <line x1="295" y1="285" x2="390" y2="285" stroke="#f5c518" stroke-width="28" stroke-linecap="round"/>

  <!-- Outer hexagon border -->
  <polygon points="260,30 470,150 470,370 260,490 50,370 50,150"
    fill="none" stroke="#f5c518" stroke-width="6"/>
</svg>
